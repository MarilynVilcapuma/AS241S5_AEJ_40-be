name: Docker Hub

on:
  push:
    branches:
      - develop
      - Api_Instagram # puedes añadir más ramas
  pull_request:
    branches:
      - develop
      - Api_Instagram # puedes añadir más ramas
  schedule:
    # Ejecutar todos los días a las 8:00 AM hora Perú (UTC-5) → 1:00 PM UTC
    - cron: '0 13 * * *'
  workflow_dispatch:  # Permite ejecución manual desde GitHub Actions UI

jobs:
  dockerhub:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout del código
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Login a Docker Hub
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_MARILYN }}
          password: ${{ secrets.DOCKERHUB_TOKEN_MARILYN }}

      # 3. Build y Push con tags latest y SHA
      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME_MARILYN }}/as241s5_aej_44-be:latest
            ${{ secrets.DOCKERHUB_USERNAME_MARILYN }}/as241s5_aej_44-be:${{ github.sha }}